<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;display=swap');
      .logo-title {
        font-family: 'Fredoka', sans-serif;
        font-size: 38px;
        font-weight: 700;
        fill: #FFE66D;
        letter-spacing: 2px;
      }
      .logo-sub {
        font-family: 'Fredoka', sans-serif;
        font-size: 13px;
        fill: #E23E1A;
        letter-spacing: 3px;
      }
    </style>
    <linearGradient id="saltena-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE66D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#E23E1A" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Ícono Estilizado de Salteña Monaka -->
    <g transform="translate(5, 5)">
      <path d="M 10 55 C 10 20, 50 10, 75 35 C 60 55, 35 70, 10 55 Z" fill="url(#saltena-grad)" />
      <path d="M 15 52 C 30 35, 60 30, 70 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
      <circle cx="45" cy="40" r="3" fill="#E23E1A" />
    </g>

    <!-- Texto Principal MONAKA -->
    <text x="90" y="52" class="logo-title">MONAKA</text>

    <!-- Subtexto SALTEÑERÍA -->
    <text x="92" y="72" class="logo-sub">SALTEÑERÍA</text>
  </g>
</svg>
